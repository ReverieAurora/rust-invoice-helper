[package]
name = "invoice-helper"
version = "0.3.1-hotfix"
edition = "2021"
description = "带轻量内联 TUI 的本地 PDF 发票校验、分类与销售方汇总工具"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
lopdf = { version = "0.42", default-features = false }
pdf-extract = "0.12"
ratatui = "0.29"
regex = "1.11"
rfd = "0.15"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_xlsxwriter = "0.79"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wait-timeout = "0.2"

[profile.release]
strip = true
lto = "thin"
